[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docomo"
version = "0.1.0"
description = "Decision-oriented grounding and empirical software complexity estimation"
requires-python = ">=3.11"

[project.scripts]
docomo = "docomo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
