[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docomo"
version = "0.17.0"
description = "Evidence-grounded software complexity and domain-specific cost calibration"
requires-python = ">=3.11"

[project.scripts]
docomo = "docomo.cli:main"
docomo-calibrate = "docomo.calibration_cli:main"
docomo-forecast = "docomo.forecast_cli:main"
docomo-source-audit = "docomo.source_cli:main"
docomo-projects = "docomo.projects_cli:main"
docomo-scrutiny = "docomo.scrutiny_cli:main"
docomo-repairs = "docomo.repair_cli:main"
docomo-score-repairs = "docomo.repair_scoring_cli:main"
docomo-industrial = "docomo.industrial_cli:main"

[project.optional-dependencies]
repair = ["pyarrow>=17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
