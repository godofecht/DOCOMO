name: tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Ensure accepted-only project cohorts cannot fabricate a failure probability
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tests')
          from test_holdout import make_experiment
          from docomo.holdout import evaluate_holdout
          result = evaluate_holdout(make_experiment(), allow_synthetic=True)
          assert result['acceptance_evaluation']['status'] == 'insufficient_acceptance_evidence'
          assert result['acceptance_evaluation']['coefficients'] is None
          PY
      - name: Explicitly reject synthetic production holdout calibration
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tests')
          from test_holdout import make_experiment
          from docomo.holdout import evaluate_holdout
          try:
              evaluate_holdout(make_experiment())
          except ValueError as e:
              assert 'synthetic' in str(e)
          else:
              raise AssertionError('production holdout accepted synthetic projects')
          PY
      - run: docomo grounding examples/scheduler.json
      - run: docomo robust-grounding examples/robust-scheduler.json
      - run: docomo complexity examples/strategies.json
      - run: docomo cocomo2 examples/cocomo2-nominal.json
      - run: docomo manifest examples/project-manifest.json
      - run: docomo ledger examples/effort-ledger.json
      - run: docomo protocol-freeze examples/prospective-protocol.json
      - name: Reject synthetic multi-project audits in production CLI
        run: |
          if docomo study-audit examples/study-bundle.json; then
            echo "Synthetic study bundle was improperly accepted"
            exit 1
          fi
      - run: docomo native-calibrate examples/project-manifest-list.json
      - name: Calibrate on immutable upstream public datasets
        run: docomo-calibrate --output calibration-report.json
      - name: Reproduce published METR effect without a global productivity multiplier
        run: |
          python - <<'PY'
          import json
          result = json.load(open("calibration-report.json"))
          early = result["early_ai_task_time"]
          historic = result["historical_effort"]
          assert historic["samples"] == 63
          assert early["samples"] == 246
          assert abs(early["ai_time_ratio_minus_one"] - 0.188) < 0.003
          assert result["calibration_status"] == "partial_domain_specific"
          hie = result["hie_task_process_diagnostics"]
          assert hie["tasks"] == 330 and hie["developers"] == 22
          assert len(hie["llms"]) == 3
          assert hie["predictor_timing"]["post_execution_diagnostic"].startswith("RETROSPECTIVE ONLY")
          print("HIE pre-execution metrics:", hie["metrics"]["story_points_llm"])
          print("HIE retrospective diagnostics:", hie["metrics"]["post_execution_diagnostic"])
          print("COCOMO81 historical 5-fold log-RMSE:", historic["model_metrics"])
          print("METR early-2025 time ratio minus one:", early["ai_time_ratio_minus_one"])
          print("METR clustered bootstrap 95%:", early["cluster_bootstrap_95pct"])
          PY
      - name: Exercise actual historical and AI-task forecasts
        run: |
          docomo-forecast --report calibration-report.json --input examples/forecast-task.json
          docomo-forecast --report calibration-report.json --input examples/forecast-historical.json
      - uses: actions/upload-artifact@v4
        with:
          name: docomo-public-calibration
          path: calibration-report.json
