name: tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Ensure accepted-only project cohorts cannot fabricate a failure probability
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tests')
          from test_holdout import make_experiment
          from docomo.holdout import evaluate_holdout
          result = evaluate_holdout(make_experiment(), allow_synthetic=True)
          assert result['acceptance_evaluation']['status'] == 'insufficient_acceptance_evidence'
          assert result['acceptance_evaluation']['coefficients'] is None
          PY
      - name: Explicitly reject synthetic production holdout calibration
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tests')
          from test_holdout import make_experiment
          from docomo.holdout import evaluate_holdout
          try:
              evaluate_holdout(make_experiment())
          except ValueError as e:
              assert 'synthetic' in str(e)
          else:
              raise AssertionError('production holdout accepted synthetic projects')
          PY
      - run: docomo grounding examples/scheduler.json
      - run: docomo robust-grounding examples/robust-scheduler.json
      - run: docomo complexity examples/strategies.json
      - run: docomo cocomo2 examples/cocomo2-nominal.json
      - run: docomo manifest examples/project-manifest.json
      - run: docomo ledger examples/effort-ledger.json
      - run: docomo-source-audit --help
      - run: docomo protocol-freeze examples/prospective-protocol.json
      - name: Verify attestation rules with deterministic server mock
        run: python -m unittest discover -s tests -p 'test_github_attestation.py' -v
      - name: Reject synthetic multi-project audits in production CLI
        run: |
          if docomo study-audit examples/study-bundle.json; then
            echo "Synthetic study bundle was improperly accepted"
            exit 1
          fi
      - run: docomo native-calibrate examples/project-manifest-list.json
      - name: Calibrate on immutable upstream public datasets
        run: docomo-calibrate --output calibration-report.json
      - name: Reproduce published METR effect without a global productivity multiplier
        run: |
          python - <<'PY'
          import json
          result = json.load(open("calibration-report.json"))
          early = result["early_ai_task_time"]
          historic = result["historical_effort"]
          assert historic["samples"] == 63
          assert early["samples"] == 246
          assert abs(early["ai_time_ratio_minus_one"] - 0.188) < 0.003
          assert result["calibration_status"] == "partial_domain_specific"
          hie = result["hie_task_process_diagnostics"]
          assert hie["tasks"] == 330 and hie["developers"] == 22
          assert len(hie["llms"]) == 3
          assert hie["predictor_timing"]["post_execution_diagnostic"].startswith("RETROSPECTIVE ONLY")
          print("HIE pre-execution metrics:", hie["metrics"]["story_points_llm"])
          print("HIE retrospective diagnostics:", hie["metrics"]["post_execution_diagnostic"])
          print("COCOMO81 historical 5-fold log-RMSE:", historic["model_metrics"])
          print("METR early-2025 time ratio minus one:", early["ai_time_ratio_minus_one"])
          print("METR clustered bootstrap 95%:", early["cluster_bootstrap_95pct"])
          PY
      - name: Exercise actual historical and AI-task forecasts
        run: |
          docomo-forecast --report calibration-report.json --input examples/forecast-task.json
          docomo-forecast --report calibration-report.json --input examples/forecast-historical.json
      - name: Evaluate actual published completed projects with isolated cost units
        run: |
          docomo-projects --output real-project-results.json --records-output real-project-cases.json
          python - <<'PY'
          import json
          report = json.load(open('real-project-results.json'))
          source = report['source_data']
          assert source['project_observations'] == 736
          assert len(source['datasets']) == 4
          assert report['calibration_status'] == 'historical_real_effort_retrospective_not_ai_native'
          forward = report['strict_forward_year_validation']
          assert set(forward['domains']) == {'nasa93', 'desharnais'}
          for name, years in forward['domains'].items():
              assert years['total_project_observations'] in (93, 81)
              assert years['scored_future_year_projects'] > 0
              assert (years['scored_future_year_projects'] + years['unscored_early_projects']
                      == years['total_project_observations'])
              print('STRICT-FORWARD', name,
                    'test projects:',years['scored_future_year_projects'],
                    'unscored early:',years['unscored_early_projects'],
                    'size RMSE:',years['metrics']['size_only']['log_rmse'],
                    'driver RMSE:',years['metrics']['size_and_observed_drivers']['log_rmse'])
          for name, domain in report['evaluations']['cohort_results'].items():
              assert domain['metrics']['size_only']['n'] == domain['n']
              assert domain['metrics']['size_and_observed_drivers']['n'] == domain['n']
              print(name, 'projects:', domain['n'],
                    'size log-RMSE:', domain['metrics']['size_only']['log_rmse'],
                    'driver log-RMSE:', domain['metrics']['size_and_observed_drivers']['log_rmse'],
                    'cost unit:', domain['unit'],
                    'validation:', domain['evaluation'])
          PY
      - name: Scrutinize a source-pinned amendment and explicitly block automatic release
        run: |
          docomo-scrutiny --output amendment-scrutiny-report.json
          python - <<'PY'
          import json
          report = json.load(open('amendment-scrutiny-report.json'))
          assert not report['requested_model_upgrade_automatically_authorized']
          assert report['release_status'] == 'research_candidate_not_eligible_for_ai_native_release'
          assert len(report['datasets_scrutinized']) == 4
          assert len(report['strict_forward_year_challenges']) == 2
          assert 'strict_forward_year_screen' in report['release_gates']
          print('Forward-year screen passed:', report['strict_forward_year_screen_passed'])
          for check in report['strict_forward_year_challenges']:
              print('Forward-year challenge:', check['dataset'],
                    'relative log-RMSE gain:', check['relative_log_rmse_improvement'],
                    'significant regression:', check['regression_exceeds_budget'])
          print('Candidate positive domains:', report['positive_domains'])
          print('Substantial regressions:', report['substantial_regressions'])
          for item in report['datasets_scrutinized']:
              print(item['dataset'], item['relative_improvement_fraction'],
                    'negative:', item['negative_result'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: docomo-real-project-amendment-scrutiny
          path: |
            real-project-results.json
            real-project-cases.json
            amendment-scrutiny-report.json
      - name: Install optional Parquet support for independent human-validated repair inventory
        run: python -m pip install -e '.[repair]'
      - run: docomo-score-repairs --help
      - run: docomo-industrial --help
      - name: Confirm Mendeley v2 parser rejects missing original source and keeps fixtures synthetic
        run: |
          python -m unittest discover -s tests -p 'test_industrial_stories.py' -v
          if docomo-industrial score catalog/mendeley_v2_mapping.template.json --mapping catalog/mendeley_v2_mapping.template.json; then
            echo "Incorrectly accepted a placeholder dataset as original source"
            exit 1
          fi
      - name: Verify original 500 real source-repository repair cases without gold-patch leakage
        run: |
          docomo-repairs --index-output verified-repair-index.json
          python - <<'PY'
          import json
          cases = json.load(open('verified-repair-index.json'))
          assert cases['repair_issues'] == 500
          assert cases['evaluated_agent_runs'] == 0
          assert cases['original_human_effort_minutes_available'] is False
          assert cases['repository_count'] == 12
          assert len(cases['cases']) == 500
          for c in cases['cases']:
              assert c['gold_patch_sha256'] and c['gold_test_patch_sha256']
              assert c['developer_human_minutes'] is None
              assert c['machine_expenditure'] is None
              assert 'problem_statement' not in c and 'patch' not in c
          print('Human-validated real repair issue metadata:', cases['repair_issues'])
          print('Distinct source repositories:', cases['repository_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: docomo-real-repair-inventory
          path: verified-repair-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: docomo-public-calibration
          path: calibration-report.json
